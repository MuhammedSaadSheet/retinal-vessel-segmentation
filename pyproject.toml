[project]
name "retinal-vessel-segmentation"
version = "0.1.0"
description = "Classical image processing pipeline for retinal blood vessel segmentation on DRIVE images."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Muhammed Saad" }
]
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"